[project]
name = "microshare"
version = "0.1.0"
description = "A 股、期货、期权数据本地化管道：Tushare Pro 拉取 → Parquet 分区存储 → DuckDB 本地查询，支持增量同步与定时调度"
requires-python = ">=3.11"
dependencies = [
    "tushare>=1.4.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "apscheduler>=3.10.0,<4.0",
    "click>=8.1.0",
    "loguru>=0.7.0",
    "rqdatac>=3.0",
    "lark-oapi>=1.4.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microshare"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "httpx>=0.27.0",
]
