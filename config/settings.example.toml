[tushare]
token = "your_tushare_token_here"

[paths]
data_dir = "data"
db_path = "db/meta.duckdb"
log_path = "logs/pipeline.log"

[universe]
name = "hushen_mainboard_previous_day_bottom1000"
version = "current"
target_count = 1000
min_listing_sessions = 120
exclude_st = true
main_board_prefixes = ["600", "601", "603", "605", "000", "001", "002", "003"]

[api]
host = "127.0.0.1"
port = 8787
default_limit = 1000
max_limit = 5000

[scheduler]
enabled = false
timezone = "Asia/Shanghai"
run_time = "18:30"
state_path = "db/scheduler/latest_run.json"
lock_path = "db/scheduler/run.lock"

[notifier]
enabled = false  # 配置应用凭据和接收者后改为 true

[notifier.feishu]
enabled = false
receive_id_type = "user_id"
receive_id = "YOUR_FEISHU_USER_ID"
# 可用 FEISHU_APP_ID 和 FEISHU_APP_SECRET 环境变量覆盖发送模块默认凭据

[ricequant]
enabled = false
username = ""
password = ""
license_key = ""

[ricequant.stock_minute]
request_sleep_seconds = 0.2
batch_size = 1000
adjust_type = "none"
skip_suspended = true

[ricequant.etf_minute]
enabled = false
request_sleep_seconds = 0.2
batch_size = 500
adjust_type = "none"
skip_suspended = true

[quality]
enabled = false
mode = "daily"
markets = ["stock", "index", "etf", "futures", "options"]
notify_on = ["warn", "fail"]
